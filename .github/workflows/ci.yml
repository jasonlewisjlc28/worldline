name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Verify map asset copied
        run: cp -f public/countries-110m.json dist/public/ && test -f dist/public/countries-110m.json
