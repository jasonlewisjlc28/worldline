<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Corn Stalk — 3D Preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
  #app { width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 14px; left: 14px; color: #9fb7c9;
    font: 13px/1.5 system-ui, sans-serif; user-select: none;
    background: rgba(13,17,23,.65); padding: 10px 14px; border-radius: 10px;
    border: 1px solid #1f2b38; backdrop-filter: blur(6px);
  }
  #hud b { color: #7ef0c8; }
  #hud .keys { color: #5b7183; font-size: 12px; }
  #controls { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; }
  #controls button {
    background: #16212e; color: #9fb7c9; border: 1px solid #2a3a4d;
    border-radius: 8px; padding: 7px 12px; font: 12px system-ui, sans-serif;
    cursor: pointer;
  }
  #controls button.active { background: #1d3a2f; color: #7ef0c8; border-color: #2f6b52; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #7ef0c8; font: 15px system-ui, sans-serif; background: #0d1117;
    transition: opacity .4s; z-index: 10;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">Loading model…</div>
<div id="hud">
  <b>Neon Corn Stalk</b> · farming iconography<br/>
  <span class="keys">drag — orbit · right-drag — pan · scroll — zoom · double-click — reset</span>
</div>
<div id="controls">
  <button id="planes" class="active">Planes</button>
  <button id="spin" class="active">Auto-rotate</button>
  <button id="wire">Wireframe</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);

// soft studio environment for glossy/neon materials
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 2.0;

const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(3, 5, 4);
scene.add(keyLight);
scene.add(new THREE.AmbientLight(0x334455, 0.8));

let model = null;
const modelUrl = new URLSearchParams(location.search).get('model') || './neon-corn-lowpoly.glb';
const loader = new GLTFLoader();
loader.load(
  modelUrl,
  (gltf) => {
    model = gltf.scene;

    // center + fit camera
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;
    model.position.sub(center);

    const dist = radius / Math.tan((camera.fov * Math.PI) / 360) * 1.6;
    camera.position.set(dist * 0.55, dist * 0.35, dist * 0.75);
    camera.near = radius / 100;
    camera.far = radius * 100;
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.minDistance = radius * 0.6;
    controls.maxDistance = radius * 8;
    controls.update();

    scene.add(model);
    window.__model = model; // debug/verification handle
    const el = document.getElementById('loading');
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 450);
  },
  (xhr) => {
    const el = document.getElementById('loading');
    if (el && xhr.total) el.textContent = `Loading model… ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
  },
  (err) => {
    document.getElementById('loading').textContent = 'Failed to load model: ' + err;
  }
);

document.getElementById('spin').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.target.classList.toggle('active', controls.autoRotate);
});
// find a named node in the loaded scene ('solid' / 'cards' / 'wire_solid' / 'wire_cards')
function namedNode(name) {
  let hit = null;
  if (model) model.traverse((o) => { if (o.name === name) hit = o; });
  return hit;
}
document.getElementById('planes').addEventListener('click', (e) => {
  // toggles the plane OUTLINE boxes only — the red drawings on the cards stay
  // visible (the card material is MASK alpha-tested, so no translucent fill)
  const on = e.target.classList.toggle('active');
  const node = namedNode('wire_cards');
  if (node) node.visible = on;
});
document.getElementById('wire').addEventListener('click', (e) => {
  const on = e.target.classList.toggle('active');
  for (const n of ['wire_solid', 'wire_cards']) {
    const node = namedNode(n);
    if (node) node.visible = on;
  }
});

renderer.domElement.addEventListener('dblclick', () => {
  if (!model) return;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;
  const dist = radius / Math.tan((camera.fov * Math.PI) / 360) * 1.6;
  camera.position.set(dist * 0.55, dist * 0.35, dist * 0.75);
  controls.target.set(0, 0, 0);
  controls.update();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
